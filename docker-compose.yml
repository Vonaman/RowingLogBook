services:
  db:
    image: postgres:18-alpine
    restart: "no" # Ne redémarre pas automatiquement au démarrage du poste
    container_name: rowing_logbook_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rowing_logbook}
    ports:
      - "9876:5432"
    volumes:
      - postgres_data:/var/lib/postgresql # Données persistantes
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql # Init au premier démarrage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rowing_logbook}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
